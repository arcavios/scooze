[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "scooze"
version = "2.0.4"
description = "A flexible data layer for applications working with Magic: the Gathering cards and decks."
readme = "README.md"
requires-python = ">=3.11,<4"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alexander Gimmi", email = "iambroadband@gmail.com" },
    { name = "Ben Horkley", email = "ben.horkley@gmail.com" },
    { name = "Jacob Ginsparg", email = "jacobginsparg@gmail.com" },
]
dependencies = [
    "beanie>=1.23.0,<2.0.0",
    "cleo>=2.0.1,<3.0.0",
    "fastapi>=0.100.0,<1.0.0",
    "frozendict>=2.3.8,<3.0.0",
    "ijson>=3.2.3,<4.0.0",
    "motor>=3.2.0,<4.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "requests>=2.32.2,<3.0.0",
    "setuptools>=72.0.0,<73.0.0",
    "uvicorn[standard]>=0.23.1,<0.24.0",
    "venv-run>=0.2.0,<0.3.0",
]

[project.urls]
Homepage = "https://github.com/arcavios/scooze"
Repository = "https://github.com/arcavios/scooze"
Documentation = "https://scooze.readthedocs.io"

[project.scripts]
scooze = "scooze.console.cli:run_cli"

[tool.poetry]
packages = [{ include = "scooze", from = "src" }]

[tool.poetry.group.dev.dependencies]
asgi-lifespan = "^2.1.0"
black = "^26.3.1"
coverage = "^7.3.2"
httpx = "^0.24.1"
isort = "^5.12.0"
mongomock-motor = "^0.0.25"
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.5.3"
mkdocs-material = "^9.5.15"
mkdocs-simple-hooks = "^0.1.5"
mkdocstrings = "^0.24.1"
mkdocstrings-python = "^1.9.0"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
src_paths = ["scooze", "tests"]

[tool.pytest.ini_options]
# addopts = "-m 'not slow'"
addopts = "-W ignore::DeprecationWarning -m 'not context'"
asyncio_mode = "auto"
markers = ["slow: expected to be slow", "context: related to managed context"]
